<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhattan Unlocked</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="topbar">
        <div id="topbar-title">Manhattan Unlocked</div>
        <div id="counter-wrap">
            <span id="counter-num">0</span>
            <span id="counter-label">/ 12 districts explored</span>
        </div>
        <div id="progress-track"><div id="progress-fill"></div></div>
    </header>

    <div class="main-container">

        <div id="map"></div>

        <div id="ui-panel">
            <div id="district-info">

            <!-- Default state -->
            <div id="panel-default">
                <div class="panel-eyebrow">Your progress</div>

                <div class="stats-grid">
                    <div class="stat-block">
                        <div class="stat-value" id="stat-pct">0%</div>
                        <div class="stat-label">of Manhattan</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-value" id="stat-count">0 / 12</div>
                        <div class="stat-label">districts</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-value" id="stat-visits">0</div>
                        <div class="stat-label">check-ins</div>
                    </div>
                </div>

                <div class="stat-next-wrap">
                    <div class="panel-eyebrow">Up next</div>
                    <div id="stat-next" class="stat-next-name">Financial District & Battery Park City</div>
                </div>

                <div id="hover-preview" class="hidden">
                    <hr class="panel-divider">
                    <div class="panel-eyebrow">Hovering</div>
                    <div id="hover-preview-name" class="hover-preview-name"></div>
                    <p id="hover-preview-info" class="panel-body" style="margin-bottom:0"></p>
                </div>

                <div class="legend-wrap">
                    <div class="legend-item"><span class="legend-dot dot-start"></span> Starting point</div>
                    <div class="legend-item"><span class="legend-dot dot-unlocked"></span> Unlocked</div>
                    <div class="legend-item"><span class="legend-dot dot-locked"></span> Locked</div>
                </div>
            </div>

            <!-- Selected district state -->
            <div id="panel-selected" class="hidden">
                <div class="panel-eyebrow" id="panel-status-label">Unlocked</div>
                <h2 class="panel-title" id="panel-district-name">—</h2>
                <p id="panel-description" class="panel-description"></p>
                <div id="panel-visit-count" class="visit-pills"></div>
                <p class="panel-body" id="panel-body-text"></p>

                <div id="upload-section" class="hidden">
                    <label class="upload-label" for="photo-upload">
                        <span class="upload-icon">↑</span>
                        <span>Drop a photo or tap to browse</span>
                        <span class="upload-hint">Must be taken at this location</span>
                    </label>
                    <input type="file" id="photo-upload" accept="image/*" capture="environment">
                    <div id="file-chosen" class="hidden"></div>
                    <button id="submit-btn" class="hidden">Verify &amp; Unlock</button>
                </div>
            </div>

            <!-- Congratulations state -->
            <div id="panel-congrats" class="hidden">
                <div class="congrats-burst">✦</div>
                <div class="panel-eyebrow">Congratulations!</div>
                <h2 class="panel-title" id="congrats-district">—</h2>
                <p class="panel-body" id="congrats-body"></p>
                <div id="congrats-unlocked-list"></div>
                <div class="congrats-actions">
                    <button id="share-btn" class="btn-secondary">Share ↗</button>
                    <button id="congrats-continue-btn">Continue →</button>
                </div>
            </div>

            </div>
        </div>

    </div>

    <script src="config.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="public/js/firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
